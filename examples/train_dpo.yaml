# Qwen/Qwen3.5-4B DPO with LoRA.
# Input JSONL rows contain: prompt, chosen, rejected.

model:
  name_or_path: Qwen/Qwen3.5-4B
  dtype: bfloat16
  trust_remote_code: true

data:
  train_file: data/preferences-train.jsonl
  validation_file: data/preferences-validation.jsonl
  format: dpo

training:
  output_dir: outputs/qwen35-dpo
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  mixed_precision: bf16
  max_grad_norm: 1.0
  log_every_steps: 10

optimizer:
  learning_rate: 0.00001
  weight_decay: 0.0

scheduler:
  name: cosine
  warmup_ratio: 0.1

gradient_checkpointing:
  enabled: true
  use_reentrant: false

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

dpo:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
  max_length: 1024
  max_prompt_length: 512
  reference_free: false
  system_prompt: You are a helpful and precise assistant.

checkpoint:
  save_every_steps: null
  keep_last: 1

evaluation:
  every_epochs: 1

artifacts:
  save: adapter
