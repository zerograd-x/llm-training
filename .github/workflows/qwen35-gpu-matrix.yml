name: Qwen3.5 Training GPU Matrix

on:
  workflow_dispatch:

jobs:
  single-gpu:
    strategy:
      fail-fast: false
      matrix:
        case: [partial_bf16, lora, max_steps, pretrain_data]
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "0"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OUTPUT_ROOT: \${{ runner.temp }}/llm-training-qwen35-\${{ github.run_id }}-\${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: llm-training
      - uses: actions/checkout@v4
        with:
          repository: zerograd-x/llm-training-data
          path: llm-training-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Build wheels
        run: |
          (cd llm-training && python -m build --wheel)
          (cd llm-training-data && python -m build --wheel)
      - name: Create isolated environment
        run: |
          python -m venv ".venv-\${{ matrix.case }}"
          source ".venv-\${{ matrix.case }}/bin/activate"
          pip install --upgrade pip
          pip install llm-training/dist/llm_training-*.whl
          pip install llm-training-data/dist/llm_training_data-*.whl
          pip install "peft>=0.15,<1" "safetensors>=0.4,<1"
      - run: nvidia-smi
      - name: Run Qwen3.5-4B training smoke
        run: |
          source ".venv-\${{ matrix.case }}/bin/activate"
          cd llm-training
          python tests/gpu/qwen35_single_gpu_matrix.py \
            --case "\${{ matrix.case }}" \
            --output-root "$OUTPUT_ROOT"
      - name: Retain smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-training-\${{ matrix.case }}-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: \${{ env.OUTPUT_ROOT }}/\${{ matrix.case }}
          if-no-files-found: warn

  four-gpu-zero3:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 90
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OUTPUT_DIR: \${{ runner.temp }}/llm-training-qwen35-zero3-\${{ github.run_id }}-\${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel
        run: |
          python -m venv .venv-zero3
          source .venv-zero3/bin/activate
          pip install --upgrade pip
          pip install dist/llm_training-*.whl
          pip install "peft>=0.15,<1" "safetensors>=0.4,<1" "deepspeed>=0.14.5,<1"
      - name: Require four GPUs
        run: |
          source .venv-zero3/bin/activate
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA is required"
          assert torch.cuda.device_count() >= 4, (
              f"4-GPU test requires >=4 GPUs, got {torch.cuda.device_count()}"
          )
          assert torch.cuda.is_bf16_supported(), "BF16 GPU is required"
          print([torch.cuda.get_device_name(i) for i in range(4)])
          PY
      - run: nvidia-smi
      - name: Run Qwen3.5-4B ZeRO-3 train/export
        run: |
          source .venv-zero3/bin/activate
          torchrun --standalone --nproc_per_node=4 \
            tests/gpu/qwen35_4b_single_node.py \
            --output "$OUTPUT_DIR"
      - name: Reload exported checkpoint
        run: |
          source .venv-zero3/bin/activate
          CUDA_VISIBLE_DEVICES=0 python tests/gpu/verify_qwen35_export.py \
            "$OUTPUT_DIR/final-model"
      - name: Retain ZeRO-3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-training-zero3-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: \${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
