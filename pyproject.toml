[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-training"
version = "0.1.0"
description = "A small, opinionated training runtime for Hugging Face causal language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0,<2",
  "PyYAML>=6,<7",
  "torch>=2.1",
  "transformers>=5.3,<6",
]

[project.scripts]
llm-train = "llm_training.cli:main"

[project.optional-dependencies]
peft = [
  "peft>=0.15,<1",
  "safetensors>=0.4,<1",
]
deepspeed = [
  "deepspeed>=0.14.5,<1",
]
dpo = [
  "datasets>=4,<5",
  "trl>=1.12,<1.13",
]
grpo = [
  "datasets>=4,<5",
  "trl>=1.12,<1.13",
]
vllm = [
  "trl[vllm]>=1.12,<1.13",
]
rl = [
  "datasets>=4,<5",
  "trl>=1.12,<1.13",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: downloads and runs a real external model",
  "gpu: requires a CUDA GPU",
]
