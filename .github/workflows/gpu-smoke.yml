name: GPU Smoke

on:
  workflow_dispatch:

jobs:
  bf16-smoke:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: nvidia-smi
      - run: python -c "import torch; print('cuda_available=', torch.cuda.is_available()); print('device=', torch.cuda.get_device_name(0) if torch.cuda.is_available() else None); print('bf16_supported=', torch.cuda.is_bf16_supported() if torch.cuda.is_available() else False)"
      - run: pytest -m gpu tests/gpu
